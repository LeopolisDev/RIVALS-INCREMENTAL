<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIVALS INCREMENTAL</title>
  <style>
    :root {
      --bg1: #102130;
      --bg2: #17314a;
      --panel: rgba(10, 16, 24, 0.82);
      --text: #e8f4ff;
      --accent: #ff5858;
      --player: #68c8ff;
      --enemy: #ff4c4c;
      --good: #43e06a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 20%, rgba(76, 142, 196, 0.25), transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(78, 182, 122, 0.16), transparent 45%),
        linear-gradient(170deg, var(--bg1), var(--bg2));
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    #gameShell {
      width: min(94vw, 920px);
      height: min(94vh, 920px);
      display: grid;
      grid-template-rows: auto 1fr 130px;
      gap: 12px;
    }

    #topHud {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 10px 12px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #leftHud {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #rightHud {
      text-align: right;
      font-size: 13px;
      line-height: 1.4;
      opacity: 0.95;
    }

    #title {
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 16px;
    }

    #stats {
      display: flex;
      gap: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    #arenaWrap {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 360px;
      border-radius: 18px;
      border: 3px solid rgba(237, 219, 123, 0.8);
      overflow: hidden;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.32);
      background: #87b568;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    #upgradePanel {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      user-select: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    #upgradeTitle {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    #upgradeSlots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    #onlinePanel {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      padding: 8px;
      min-height: 88px;
    }

    #onlineTitle {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    #connectionText {
      font-size: 12px;
      margin-bottom: 4px;
      color: #87d8ff;
    }

    #playerList {
      margin: 0;
      padding-left: 16px;
      font-size: 12px;
      line-height: 1.35;
      max-height: 60px;
      overflow: auto;
    }

    #queueStatusText {
      font-size: 12px;
      color: #cbe9ff;
      margin-bottom: 6px;
    }

    #queueBtn {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
      color: #e8f4ff;
      border-radius: 8px;
      font-size: 12px;
      padding: 7px 8px;
      cursor: pointer;
    }

    #queueBtn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .slot {
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      font-size: 13px;
      text-align: center;
      color: rgba(232, 244, 255, 0.9);
    }

    @media (max-width: 760px), (max-height: 760px) {
      #gameShell {
        grid-template-rows: auto 1fr 110px;
      }

      #upgradeSlots {
        grid-template-columns: 1fr;
      }

      #upgradePanel {
        grid-template-columns: 1fr;
      }

      #rightHud {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="gameShell">
    <div id="topHud">
      <div id="leftHud">
        <div id="title">RIVALS INCREMENTAL</div>
        <div id="stats">
          <span id="keysText">Keys: 0</span>
          <span id="playerHpText">Your HP: 100</span>
          <span id="enemyHpText">Enemy HP: 150</span>
        </div>
      </div>
      <div id="rightHud">
        <div>Gun: Assault Rifle (10 dmg, 0.1s)</div>
        <div>Move: WASD | Shoot: Left Mouse</div>
      </div>
    </div>

    <div id="arenaWrap">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="upgradePanel">
      <div>
        <div id="upgradeTitle">Guns / Upgrades (spend keys) - placeholder row</div>
        <div id="upgradeSlots">
          <div class="slot">Rifle Lv2 - Soon</div>
          <div class="slot">Damage Boost - Soon</div>
          <div class="slot">Fire Rate Boost - Soon</div>
        </div>
      </div>
      <div id="onlinePanel">
        <div id="onlineTitle">Online Battle Lobby</div>
        <div id="connectionText">Status: offline</div>
        <div id="queueStatusText">1v1 Queue: 0 waiting</div>
        <button id="queueBtn" type="button">Join 1v1 Matchmaking</button>
        <ol id="playerList"></ol>
      </div>
    </div>
  </div>

  <script>
    window.RIVALS_WS_URL = window.RIVALS_WS_URL || "";

    const arenaWrap = document.getElementById("arenaWrap");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const keysText = document.getElementById("keysText");
    const playerHpText = document.getElementById("playerHpText");
    const enemyHpText = document.getElementById("enemyHpText");
    const connectionText = document.getElementById("connectionText");
    const queueStatusText = document.getElementById("queueStatusText");
    const queueBtn = document.getElementById("queueBtn");
    const playerList = document.getElementById("playerList");

    const world = {
      width: 0,
      height: 0
    };

    const player = {
      x: 0,
      y: 0,
      radius: 16,
      speed: 280
    };

    const gun = {
      damage: 10,
      bulletSpeed: 720,
      bulletLife: 1.2,
      cooldownMs: 100,
      lastShotTime: -Infinity
    };

    const enemyGun = {
      cooldownMs: 800,
      bulletSpeed: 300,
      damage: 8
    };

    const state = {
      pressed: { w: false, a: false, s: false, d: false },
      mouse: { x: 0, y: 0, down: false },
      keys: 0,
      playerHp: 100,
      enemy: null,
      playerBullets: [],
      enemyBullets: [],
      networkBullets: [],
      popups: [],
      initialized: false,
      network: {
        connected: false,
        myId: null,
        myName: "",
        socket: null,
        remotePlayers: new Map(),
        sendTimer: 0,
        needsRespawnSync: false,
        queueSize: 0,
        inQueue: false
      }
    };

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function pxToNx(x) {
      return clamp(x / world.width, 0, 1);
    }

    function pxToNy(y) {
      return clamp(y / world.height, 0, 1);
    }

    function nxToPx(x) {
      return x * world.width;
    }

    function nyToPy(y) {
      return y * world.height;
    }

    function resize() {
      const width = Math.max(320, Math.floor(arenaWrap.clientWidth));
      const height = Math.max(320, Math.floor(arenaWrap.clientHeight));
      world.width = width;
      world.height = height;
      canvas.width = width;
      canvas.height = height;

      if (!state.initialized) {
        player.x = world.width * 0.5;
        player.y = world.height * 0.5;
        state.mouse.x = player.x;
        state.mouse.y = player.y;
        state.initialized = true;
      } else {
        player.x = clamp(player.x, player.radius, world.width - player.radius);
        player.y = clamp(player.y, player.radius, world.height - player.radius);
      }

      if (state.enemy) {
        state.enemy.x = clamp(state.enemy.x, state.enemy.radius, world.width - state.enemy.radius);
        state.enemy.y = clamp(state.enemy.y, state.enemy.radius, world.height - state.enemy.radius);
      }
    }
    window.addEventListener("resize", resize);

    function spawnEnemy() {
      const radius = 18;
      const speed = randomRange(70, 140);
      const maxHp = 150;
      let x = randomRange(radius, world.width - radius);
      let y = randomRange(radius, world.height - radius);

      let tries = 0;
      while (tries < 25) {
        const dx = x - player.x;
        const dy = y - player.y;
        if (dx * dx + dy * dy > 180 * 180) {
          break;
        }
        x = randomRange(radius, world.width - radius);
        y = randomRange(radius, world.height - radius);
        tries += 1;
      }

      const angle = randomRange(0, Math.PI * 2);
      state.enemy = {
        x,
        y,
        radius,
        hp: maxHp,
        maxHp,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        turnTimer: randomRange(0.5, 1.8),
        speed,
        shootTimer: randomRange(0.25, 0.7)
      };
      updateHud();
    }

    function updateHud() {
      keysText.textContent = "Keys: " + state.keys;
      playerHpText.textContent = "Your HP: " + Math.max(0, Math.ceil(state.playerHp));
      const hp = state.enemy ? Math.max(0, Math.floor(state.enemy.hp)) : 0;
      enemyHpText.textContent = "Enemy HP: " + hp;
    }

    function updatePlayer(dt) {
      let moveX = 0;
      let moveY = 0;
      if (state.pressed.w) moveY -= 1;
      if (state.pressed.s) moveY += 1;
      if (state.pressed.a) moveX -= 1;
      if (state.pressed.d) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX /= len;
        moveY /= len;
      }

      player.x += moveX * player.speed * dt;
      player.y += moveY * player.speed * dt;
      player.x = clamp(player.x, player.radius, world.width - player.radius);
      player.y = clamp(player.y, player.radius, world.height - player.radius);
    }

    function updateEnemy(dt) {
      const enemy = state.enemy;
      if (!enemy) return;

      enemy.turnTimer -= dt;
      if (enemy.turnTimer <= 0) {
        const angle = randomRange(0, Math.PI * 2);
        enemy.vx = Math.cos(angle) * enemy.speed;
        enemy.vy = Math.sin(angle) * enemy.speed;
        enemy.turnTimer = randomRange(0.5, 1.8);
      }

      enemy.x += enemy.vx * dt;
      enemy.y += enemy.vy * dt;

      if (enemy.x < enemy.radius) {
        enemy.x = enemy.radius;
        enemy.vx *= -1;
      } else if (enemy.x > world.width - enemy.radius) {
        enemy.x = world.width - enemy.radius;
        enemy.vx *= -1;
      }

      if (enemy.y < enemy.radius) {
        enemy.y = enemy.radius;
        enemy.vy *= -1;
      } else if (enemy.y > world.height - enemy.radius) {
        enemy.y = world.height - enemy.radius;
        enemy.vy *= -1;
      }

      enemy.shootTimer -= dt;
      if (enemy.shootTimer <= 0) {
        enemyShootAtPlayer(enemy);
        enemy.shootTimer = enemyGun.cooldownMs / 1000;
      }
    }

    function enemyShootAtPlayer(enemy) {
      let dx = player.x - enemy.x;
      let dy = player.y - enemy.y;
      const len = Math.hypot(dx, dy);
      if (!len) return;
      dx /= len;
      dy /= len;
      state.enemyBullets.push({
        x: enemy.x,
        y: enemy.y,
        vx: dx * enemyGun.bulletSpeed,
        vy: dy * enemyGun.bulletSpeed,
        damage: enemyGun.damage,
        life: 2.0
      });
    }

    function updateEnemyBullets(dt) {
      const next = [];
      for (const bullet of state.enemyBullets) {
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;
        if (bullet.life <= 0) continue;
        if (bullet.x < 0 || bullet.x > world.width || bullet.y < 0 || bullet.y > world.height) {
          continue;
        }

        const dx = bullet.x - player.x;
        const dy = bullet.y - player.y;
        if (dx * dx + dy * dy <= player.radius * player.radius) {
          applyDamageToLocalPlayer(bullet.damage, player.x, player.y);
          continue;
        }

        next.push(bullet);
      }
      state.enemyBullets = next;
    }

    function spawnPlayerBullet(dirX, dirY) {
      const startOffset = player.radius + 4;
      state.playerBullets.push({
        x: player.x + dirX * startOffset,
        y: player.y + dirY * startOffset,
        vx: dirX * gun.bulletSpeed,
        vy: dirY * gun.bulletSpeed,
        damage: gun.damage,
        life: gun.bulletLife
      });
    }

    function spawnNetworkBulletVisual(ox, oy, dx, dy) {
      const pxOx = nxToPx(ox);
      const pyOy = nyToPy(oy);
      let pxDx = dx * world.width;
      let pyDy = dy * world.height;
      const len = Math.hypot(pxDx, pyDy);
      if (!len) return;
      pxDx /= len;
      pyDy /= len;
      state.networkBullets.push({
        x: pxOx,
        y: pyOy,
        vx: pxDx * gun.bulletSpeed,
        vy: pyDy * gun.bulletSpeed,
        life: gun.bulletLife
      });
    }

    function updatePlayerBullets(dt) {
      const next = [];
      for (const bullet of state.playerBullets) {
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;
        if (bullet.life <= 0) continue;
        if (bullet.x < 0 || bullet.x > world.width || bullet.y < 0 || bullet.y > world.height) continue;

        let hit = false;

        const enemy = state.enemy;
        if (enemy && enemy.hp > 0) {
          const ex = bullet.x - enemy.x;
          const ey = bullet.y - enemy.y;
          if (ex * ex + ey * ey <= enemy.radius * enemy.radius) {
            enemy.hp -= bullet.damage;
            addDamagePopup(enemy.x + randomRange(-7, 7), enemy.y + randomRange(-7, 7), bullet.damage);
            if (enemy.hp <= 0) {
              state.keys += 1;
              if (state.network.connected) {
                sendNet({ type: "addKey", amount: 1 });
              }
              spawnEnemy();
            } else {
              updateHud();
            }
            hit = true;
          }
        }
        if (hit) continue;

        for (const netPlayer of state.network.remotePlayers.values()) {
          if (netPlayer.id === state.network.myId) continue;
          const px = nxToPx(netPlayer.x);
          const py = nyToPy(netPlayer.y);
          const dx = bullet.x - px;
          const dy = bullet.y - py;
          if (dx * dx + dy * dy <= player.radius * player.radius) {
            hit = true;
            break;
          }
        }
        if (hit) continue;

        next.push(bullet);
      }
      state.playerBullets = next;
    }

    function updateNetworkBullets(dt) {
      const next = [];
      for (const bullet of state.networkBullets) {
        bullet.x += bullet.vx * dt;
        bullet.y += bullet.vy * dt;
        bullet.life -= dt;
        if (bullet.life <= 0) continue;
        if (bullet.x < 0 || bullet.x > world.width || bullet.y < 0 || bullet.y > world.height) continue;
        next.push(bullet);
      }
      state.networkBullets = next;
    }

    function addDamagePopup(x, y, amount, color = "rgba(255, 36, 36, 1)") {
      state.popups.push({
        x,
        y,
        text: "-" + amount + "HP",
        life: 0.3,
        maxLife: 0.3,
        color
      });
    }

    function updatePopups(dt) {
      for (const popup of state.popups) {
        popup.life -= dt;
      }
      state.popups = state.popups.filter((popup) => popup.life > 0);
    }

    function applyDamageToLocalPlayer(amount, px, py) {
      state.playerHp = clamp(state.playerHp - amount, 0, 100);
      addDamagePopup(px + randomRange(-8, 8), py + randomRange(-8, 8), amount);
      if (state.network.connected) {
        sendNet({ type: "setHp", hp: state.playerHp });
      }

      if (state.playerHp <= 0) {
        state.playerHp = 100;
        player.x = world.width * 0.5;
        player.y = world.height * 0.5;
        if (state.network.connected) {
          sendNet({ type: "setHp", hp: state.playerHp });
        }
      }
      updateHud();
    }

    function shootRemotePlayers(dirX, dirY) {
      if (!state.network.connected) return;
      sendNet({
        type: "shoot",
        ox: pxToNx(player.x),
        oy: pxToNy(player.y),
        dx: dirX,
        dy: dirY,
        damage: gun.damage
      });
    }

    function tryShoot(nowMs) {
      if (!state.mouse.down) return;
      if (nowMs - gun.lastShotTime < gun.cooldownMs) return;
      gun.lastShotTime = nowMs;

      let pxDx = state.mouse.x - player.x;
      let pxDy = state.mouse.y - player.y;
      const pxLen = Math.hypot(pxDx, pxDy);
      if (pxLen === 0) return;
      pxDx /= pxLen;
      pxDy /= pxLen;

      let netDx = pxToNx(state.mouse.x) - pxToNx(player.x);
      let netDy = pxToNy(state.mouse.y) - pxToNy(player.y);
      const netLen = Math.hypot(netDx, netDy);
      if (netLen === 0) return;
      netDx /= netLen;
      netDy /= netLen;

      spawnPlayerBullet(pxDx, pxDy);
      shootRemotePlayers(netDx, netDy);
    }

    function draw() {
      ctx.clearRect(0, 0, world.width, world.height);

      const gradient = ctx.createRadialGradient(
        world.width * 0.5,
        world.height * 0.5,
        40,
        world.width * 0.5,
        world.height * 0.5,
        Math.max(world.width, world.height) * 0.7
      );
      gradient.addColorStop(0, "rgba(155, 197, 104, 0.12)");
      gradient.addColorStop(1, "rgba(84, 129, 62, 0.42)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height);

      drawLaser();
      drawEnemy();
      drawPlayerBullets();
      drawEnemyBullets();
      drawNetworkBullets();
      drawRemotePlayers();
      drawDamagePopups();
      drawPlayer();
    }

    function drawPlayer() {
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#68c8ff";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.stroke();

      const hpWidth = 64;
      const hpRatio = clamp(state.playerHp / 100, 0, 1);
      const hpX = player.x - hpWidth * 0.5;
      const hpY = player.y - player.radius - 14;
      ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
      ctx.fillRect(hpX, hpY, hpWidth, 6);
      ctx.fillStyle = "#57e07f";
      ctx.fillRect(hpX, hpY, hpWidth * hpRatio, 6);
    }

    function drawEnemy() {
      const enemy = state.enemy;
      if (!enemy) return;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#ff4c4c";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.stroke();

      const barWidth = 76;
      const barHeight = 8;
      const hpRatio = clamp(enemy.hp / enemy.maxHp, 0, 1);
      const barX = enemy.x - barWidth * 0.5;
      const barY = enemy.y + enemy.radius + 10;

      ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
      ctx.fillRect(barX, barY, barWidth, barHeight);
      ctx.fillStyle = "#43e06a";
      ctx.fillRect(barX, barY, barWidth * hpRatio, barHeight);
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
      ctx.strokeRect(barX, barY, barWidth, barHeight);

      ctx.font = "bold 12px Segoe UI";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      ctx.fillStyle = "#43e06a";
      ctx.fillText(Math.ceil(enemy.hp) + "HP", enemy.x, barY + barHeight + 2);
    }

    function drawEnemyBullets() {
      for (const bullet of state.enemyBullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "#ff9e66";
        ctx.fill();
      }
    }

    function drawPlayerBullets() {
      for (const bullet of state.playerBullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#f6f2dc";
        ctx.fill();
      }
    }

    function drawNetworkBullets() {
      for (const bullet of state.networkBullets) {
        ctx.beginPath();
        ctx.arc(bullet.x, bullet.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#ffe095";
        ctx.fill();
      }
    }

    function drawRemotePlayers() {
      for (const netPlayer of state.network.remotePlayers.values()) {
        if (netPlayer.id === state.network.myId) continue;
        const px = nxToPx(netPlayer.x);
        const py = nyToPy(netPlayer.y);

        ctx.beginPath();
        ctx.arc(px, py, player.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd26a";
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(60, 40, 0, 0.8)";
        ctx.stroke();

        const hpW = 58;
        const hpR = clamp(netPlayer.hp / 100, 0, 1);
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(px - hpW / 2, py - player.radius - 14, hpW, 6);
        ctx.fillStyle = "#57e07f";
        ctx.fillRect(px - hpW / 2, py - player.radius - 14, hpW * hpR, 6);

        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.font = "bold 11px Segoe UI";
        ctx.fillStyle = "#fff0b6";
        ctx.fillText(netPlayer.name, px, py - player.radius - 16);
      }
    }

    function drawDamagePopups() {
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold 16px Segoe UI";

      for (const popup of state.popups) {
        const alpha = clamp(popup.life / popup.maxLife, 0, 1);
        const scale = 1 + (1 - alpha) * 0.08;
        ctx.save();
        ctx.translate(popup.x, popup.y);
        ctx.scale(scale, scale);
        const rgba = popup.color.replace(", 1)", ", " + alpha + ")");
        ctx.fillStyle = rgba;
        ctx.strokeStyle = "rgba(40, 0, 0, " + alpha + ")";
        ctx.lineWidth = 3;
        ctx.strokeText(popup.text, 0, 0);
        ctx.fillText(popup.text, 0, 0);
        ctx.restore();
      }
    }

    function drawLaser() {
      let dx = pxToNx(state.mouse.x) - pxToNx(player.x);
      let dy = pxToNy(state.mouse.y) - pxToNy(player.y);
      const len = Math.hypot(dx, dy);
      if (len === 0) return;
      dx /= len;
      dy /= len;

      const far = 1.8;
      const lx = nxToPx(pxToNx(player.x) + dx * far);
      const ly = nyToPy(pxToNy(player.y) + dy * far);

      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(lx, ly);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255, 70, 70, 0.95)";
      ctx.stroke();
    }

    function onKey(event, down) {
      const key = event.key.toLowerCase();
      if (key === "w" || key === "a" || key === "s" || key === "d") {
        state.pressed[key] = down;
        event.preventDefault();
      }
    }

    window.addEventListener("keydown", (event) => onKey(event, true));
    window.addEventListener("keyup", (event) => onKey(event, false));

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      state.mouse.x = event.clientX - rect.left;
      state.mouse.y = event.clientY - rect.top;
    });

    canvas.addEventListener("mousedown", (event) => {
      if (event.button === 0) {
        state.mouse.down = true;
      }
    });

    window.addEventListener("mouseup", (event) => {
      if (event.button === 0) {
        state.mouse.down = false;
      }
    });

    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    queueBtn.addEventListener("click", () => {
      if (!state.network.connected) return;
      if (state.network.inQueue) {
        sendNet({ type: "leaveQueue" });
      } else {
        sendNet({ type: "joinQueue" });
      }
    });

    function sendNet(payload) {
      const socket = state.network.socket;
      if (!socket || socket.readyState !== WebSocket.OPEN) return;
      socket.send(JSON.stringify(payload));
    }

    function updateQueueUi() {
      queueStatusText.textContent = "1v1 Queue: " + state.network.queueSize + " waiting";
      queueBtn.textContent = state.network.inQueue ? "Leave 1v1 Matchmaking" : "Join 1v1 Matchmaking";
      queueBtn.disabled = !state.network.connected;
    }

    function updateLobbyList() {
      playerList.innerHTML = "";
      const allPlayers = Array.from(state.network.remotePlayers.values());
      allPlayers.sort((a, b) => a.name.localeCompare(b.name));
      for (const netPlayer of allPlayers) {
        const item = document.createElement("li");
        const mine = netPlayer.id === state.network.myId ? " (you)" : "";
        item.textContent = netPlayer.name + mine + " - HP " + Math.ceil(netPlayer.hp) + " - Keys " + netPlayer.keys;
        playerList.appendChild(item);
      }
    }

    function connectMultiplayer() {
      if (!location.host) {
        connectionText.textContent = "Status: offline (open via server URL)";
        return;
      }

      const customWs = (window.RIVALS_WS_URL || "").trim();
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const fallbackUrl = proto + "://" + location.host;
      const url = customWs || fallbackUrl;
      const socket = new WebSocket(url);
      state.network.socket = socket;

      socket.addEventListener("open", () => {
        state.network.connected = true;
        connectionText.textContent = "Status: online";
        const stored = localStorage.getItem("rivals_name");
        const name = (stored && stored.trim()) || ("Player" + Math.floor(Math.random() * 900 + 100));
        state.network.myName = name;
        localStorage.setItem("rivals_name", name);
        sendNet({ type: "join", name });
        updateQueueUi();
      });

      socket.addEventListener("close", () => {
        state.network.connected = false;
        state.network.inQueue = false;
        state.network.queueSize = 0;
        state.network.remotePlayers.clear();
        connectionText.textContent = "Status: offline";
        updateLobbyList();
        updateQueueUi();
      });

      socket.addEventListener("message", (event) => {
        let message;
        try {
          message = JSON.parse(event.data);
        } catch {
          return;
        }

        if (message.type === "welcome") {
          state.network.myId = message.id;
          if (message.player) {
            player.x = nxToPx(message.player.x);
            player.y = nyToPy(message.player.y);
            state.playerHp = message.player.hp;
            state.keys = message.player.keys;
            updateHud();
          }
          return;
        }

        if (message.type === "queueJoined") {
          state.network.inQueue = true;
          updateQueueUi();
          return;
        }

        if (message.type === "queueLeft") {
          state.network.inQueue = false;
          updateQueueUi();
          return;
        }

        if (message.type === "queueStatus" && Number.isFinite(message.queued)) {
          state.network.queueSize = Math.max(0, Math.floor(message.queued));
          updateQueueUi();
          return;
        }

        if (message.type === "matchFound" && typeof message.url === "string") {
          state.network.inQueue = false;
          updateQueueUi();
          connectionText.textContent = "Status: match found, redirecting...";
          setTimeout(() => {
            window.location.href = message.url;
          }, 450);
          return;
        }

        if (message.type === "players" && Array.isArray(message.players)) {
          const map = new Map();
          for (const p of message.players) {
            map.set(p.id, p);
            if (p.id === state.network.myId) {
              state.playerHp = p.hp;
              state.keys = Math.max(state.keys, p.keys);
              if (state.network.needsRespawnSync) {
                player.x = nxToPx(p.x);
                player.y = nyToPy(p.y);
                state.network.needsRespawnSync = false;
              }
            }
          }
          state.network.remotePlayers = map;
          updateLobbyList();
          updateHud();
          return;
        }

        if (message.type === "damagePopup") {
          const target = state.network.remotePlayers.get(message.targetId);
          if (target) {
            addDamagePopup(
              nxToPx(target.x) + randomRange(-6, 6),
              nyToPy(target.y) + randomRange(-6, 6),
              message.amount
            );
          } else if (message.targetId === state.network.myId) {
            addDamagePopup(player.x + randomRange(-6, 6), player.y + randomRange(-6, 6), message.amount);
          }
          return;
        }

        if (message.type === "shotFired") {
          if (message.shooterId === state.network.myId) return;
          if (
            Number.isFinite(message.ox) &&
            Number.isFinite(message.oy) &&
            Number.isFinite(message.dx) &&
            Number.isFinite(message.dy)
          ) {
            spawnNetworkBulletVisual(message.ox, message.oy, message.dx, message.dy);
          }
          return;
        }

        if (message.type === "kill" && message.targetId === state.network.myId) {
          state.network.needsRespawnSync = true;
        }
      });
    }

    function sendNetworkState(dt) {
      if (!state.network.connected) return;
      state.network.sendTimer += dt;
      if (state.network.sendTimer < 0.05) return;
      state.network.sendTimer = 0;

      sendNet({
        type: "state",
        x: pxToNx(player.x),
        y: pxToNy(player.y),
        aimX: pxToNx(state.mouse.x),
        aimY: pxToNy(state.mouse.y),
        firing: state.mouse.down
      });
    }

    resize();
    spawnEnemy();
    updateHud();
    updateQueueUi();
    connectMultiplayer();

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePlayer(dt);
      updateEnemy(dt);
      updatePlayerBullets(dt);
      updateEnemyBullets(dt);
      updateNetworkBullets(dt);
      updatePopups(dt);
      tryShoot(now);
      sendNetworkState(dt);
      draw();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
