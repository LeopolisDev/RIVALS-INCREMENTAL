<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RIVALS INCREMENTAL</title>
  <style>
    :root {
      --bg1: #0e1b27;
      --bg2: #13283a;
      --panel: rgba(10, 16, 24, 0.78);
      --text: #e8f4ff;
      --accent: #ff5858;
      --player: #68c8ff;
      --enemy: #ff4c4c;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 20% 20%, #1e3b56, var(--bg1) 45%, var(--bg2));
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(4px);
      line-height: 1.45;
      font-size: 14px;
      user-select: none;
      min-width: 240px;
    }

    #title {
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div id="title">RIVALS INCREMENTAL</div>
    <div id="keysText">Keys: 0</div>
    <div id="enemyHpText">Enemy HP: 150</div>
    <div>Gun: Assault Rifle (10 dmg, 0.1s fire rate)</div>
    <div>Move: WASD | Shoot: Left Mouse</div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const keysText = document.getElementById("keysText");
    const enemyHpText = document.getElementById("enemyHpText");

    const world = {
      width: window.innerWidth,
      height: window.innerHeight
    };

    function resize() {
      world.width = window.innerWidth;
      world.height = window.innerHeight;
      canvas.width = world.width;
      canvas.height = world.height;
    }
    window.addEventListener("resize", resize);
    resize();

    const player = {
      x: world.width * 0.5,
      y: world.height * 0.5,
      radius: 16,
      speed: 280
    };

    const gun = {
      damage: 10,
      cooldownMs: 100,
      lastShotTime: -Infinity
    };

    const state = {
      pressed: { w: false, a: false, s: false, d: false },
      mouse: { x: world.width * 0.5, y: world.height * 0.5, down: false },
      keys: 0,
      enemy: null
    };

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnEnemy() {
      const radius = 18;
      const speed = randomRange(70, 140);
      let x = randomRange(radius, world.width - radius);
      let y = randomRange(radius, world.height - radius);

      let tries = 0;
      while (tries < 25) {
        const dx = x - player.x;
        const dy = y - player.y;
        if (dx * dx + dy * dy > 180 * 180) {
          break;
        }
        x = randomRange(radius, world.width - radius);
        y = randomRange(radius, world.height - radius);
        tries += 1;
      }

      const angle = randomRange(0, Math.PI * 2);
      state.enemy = {
        x,
        y,
        radius,
        hp: 150,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        turnTimer: randomRange(0.5, 1.8),
        speed
      };
      updateHud();
    }

    function updateHud() {
      keysText.textContent = "Keys: " + state.keys;
      const hp = state.enemy ? Math.max(0, Math.floor(state.enemy.hp)) : 0;
      enemyHpText.textContent = "Enemy HP: " + hp;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function updatePlayer(dt) {
      let moveX = 0;
      let moveY = 0;
      if (state.pressed.w) moveY -= 1;
      if (state.pressed.s) moveY += 1;
      if (state.pressed.a) moveX -= 1;
      if (state.pressed.d) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX /= len;
        moveY /= len;
      }

      player.x += moveX * player.speed * dt;
      player.y += moveY * player.speed * dt;
      player.x = clamp(player.x, player.radius, world.width - player.radius);
      player.y = clamp(player.y, player.radius, world.height - player.radius);
    }

    function updateEnemy(dt) {
      const enemy = state.enemy;
      if (!enemy) return;

      enemy.turnTimer -= dt;
      if (enemy.turnTimer <= 0) {
        const angle = randomRange(0, Math.PI * 2);
        enemy.vx = Math.cos(angle) * enemy.speed;
        enemy.vy = Math.sin(angle) * enemy.speed;
        enemy.turnTimer = randomRange(0.5, 1.8);
      }

      enemy.x += enemy.vx * dt;
      enemy.y += enemy.vy * dt;

      if (enemy.x < enemy.radius) {
        enemy.x = enemy.radius;
        enemy.vx *= -1;
      } else if (enemy.x > world.width - enemy.radius) {
        enemy.x = world.width - enemy.radius;
        enemy.vx *= -1;
      }

      if (enemy.y < enemy.radius) {
        enemy.y = enemy.radius;
        enemy.vy *= -1;
      } else if (enemy.y > world.height - enemy.radius) {
        enemy.y = world.height - enemy.radius;
        enemy.vy *= -1;
      }
    }

    function rayHitsEnemy(originX, originY, dirX, dirY, enemy) {
      const ox = originX - enemy.x;
      const oy = originY - enemy.y;
      const b = 2 * (ox * dirX + oy * dirY);
      const c = ox * ox + oy * oy - enemy.radius * enemy.radius;
      const disc = b * b - 4 * c;
      if (disc < 0) return false;

      const sqrtDisc = Math.sqrt(disc);
      const t1 = (-b - sqrtDisc) / 2;
      const t2 = (-b + sqrtDisc) / 2;
      return t1 >= 0 || t2 >= 0;
    }

    function tryShoot(nowMs) {
      if (!state.mouse.down) return;
      if (nowMs - gun.lastShotTime < gun.cooldownMs) return;
      gun.lastShotTime = nowMs;

      const enemy = state.enemy;
      if (!enemy) return;

      let dx = state.mouse.x - player.x;
      let dy = state.mouse.y - player.y;
      const len = Math.hypot(dx, dy);
      if (len === 0) return;
      dx /= len;
      dy /= len;

      if (rayHitsEnemy(player.x, player.y, dx, dy, enemy)) {
        enemy.hp -= gun.damage;
        if (enemy.hp <= 0) {
          state.keys += 1;
          spawnEnemy();
        } else {
          updateHud();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, world.width, world.height);

      const gradient = ctx.createRadialGradient(
        world.width * 0.5,
        world.height * 0.5,
        40,
        world.width * 0.5,
        world.height * 0.5,
        Math.max(world.width, world.height) * 0.7
      );
      gradient.addColorStop(0, "rgba(20, 38, 56, 0.3)");
      gradient.addColorStop(1, "rgba(8, 14, 22, 0.55)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, world.width, world.height);

      drawLaser();
      drawEnemy();
      drawPlayer();
    }

    function drawPlayer() {
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#68c8ff";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.75)";
      ctx.stroke();
    }

    function drawEnemy() {
      const enemy = state.enemy;
      if (!enemy) return;
      ctx.beginPath();
      ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
      ctx.fillStyle = "#ff4c4c";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255,255,255,0.6)";
      ctx.stroke();
    }

    function drawLaser() {
      let dx = state.mouse.x - player.x;
      let dy = state.mouse.y - player.y;
      const len = Math.hypot(dx, dy);
      if (len === 0) return;
      dx /= len;
      dy /= len;

      const far = Math.max(world.width, world.height) * 1.6;
      const lx = player.x + dx * far;
      const ly = player.y + dy * far;

      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(lx, ly);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(255, 70, 70, 0.95)";
      ctx.stroke();
    }

    function onKey(event, down) {
      const key = event.key.toLowerCase();
      if (key === "w" || key === "a" || key === "s" || key === "d") {
        state.pressed[key] = down;
        event.preventDefault();
      }
    }

    window.addEventListener("keydown", (event) => onKey(event, true));
    window.addEventListener("keyup", (event) => onKey(event, false));

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      state.mouse.x = event.clientX - rect.left;
      state.mouse.y = event.clientY - rect.top;
    });

    canvas.addEventListener("mousedown", (event) => {
      if (event.button === 0) {
        state.mouse.down = true;
      }
    });

    window.addEventListener("mouseup", (event) => {
      if (event.button === 0) {
        state.mouse.down = false;
      }
    });

    canvas.addEventListener("contextmenu", (event) => event.preventDefault());

    spawnEnemy();

    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePlayer(dt);
      updateEnemy(dt);
      tryShoot(now);
      draw();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
